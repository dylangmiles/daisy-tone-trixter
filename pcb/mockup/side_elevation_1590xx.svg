<text x="12.00" y="84.00" class="note" text-anchor="start">Jacks BOTTOM-MOUNTED (barrel below the board) -> axis z=18 = mid-wall. The clean fix:</text>
<text x="12.00" y="87.50" class="note" text-anchor="start">  board stays high (Seed hangs below, short OLED reach) AND the jacks land mid-wall.</text>
<text x="12.00" y="91.00" class="note" text-anchor="start">  TRS + DC bottom-mount, legs up through the PCB. USB = Seed's own port, oriented to the wall.</text>
<text x="12.00" y="95.00" class="dim" text-anchor="start">Budget: Seed-on-sockets (~17) + standoff (6) nearly fills the 33 mm; ~8 mm spare over base.</text>
